<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人知识系统首页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f3f4f6; color: #1f2937; font-size: 15px; min-height: 100vh; display: flex; flex-direction: column; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ===== 顶部导航栏（占满宽度，吸顶） ===== */
        .site-header { position: sticky; top: 0; z-index: 20; width: 100%; background: #ffffff; border-bottom: 2px solid #2563eb; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
        .brand { font-size: 20px; font-weight: bold; color: #1f2937; }
        .brand .dot { color: #2563eb; }
        .user-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .welcome { font-size: 14px; color: #374151; }
        .welcome b { color: #2563eb; }
        .btn { display: inline-block; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; padding: 7px 16px; font-size: 14px; }
        .btn:hover { background: #1d4ed8; text-decoration: none; }
        .btn-ghost { display: inline-block; border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 6px; padding: 7px 16px; font-size: 14px; }
        .btn-ghost:hover { border-color: #2563eb; color: #2563eb; text-decoration: none; }

        /* ===== 主体布局：侧边栏 + 内容区（占满宽度） ===== */
        .layout { width: 100%; max-width: 1280px; margin: 24px auto; padding: 0 28px; display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; flex: 1; }
        .side-stack { display: flex; flex-direction: column; gap: 20px; }

        /* ===== 通用框体 ===== */
        .box { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
        .box-title { background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 12px 16px; font-weight: bold; font-size: 16px; }
        .box-title .sub { font-weight: normal; font-size: 13px; color: #6b7280; margin-left: 8px; }
        .box-body { padding: 14px 16px; }

        /* ===== 侧边栏：个人中心 ===== */
        .profile { text-align: center; padding: 18px 16px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background: #2563eb; color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .avatar-ghost { background: #e5e7eb; color: #6b7280; }
        .uname { font-size: 17px; font-weight: bold; }
        .uinfo { font-size: 13px; color: #6b7280; margin-top: 6px; }
        .guest-tip { font-size: 13px; color: #6b7280; margin: 10px 0 12px; line-height: 1.7; }

        /* ===== 侧边栏：文章分类 ===== */
        .cat-list { list-style: none; }
        .cat-list li { border-radius: 6px; margin-bottom: 4px; }
        .cat-list a { display: block; padding: 8px 12px; color: #374151; border-radius: 6px; font-size: 14px; }
        .cat-list a:hover { background: #eff6ff; color: #2563eb; text-decoration: none; }
        .cat-list .cat-all a { font-weight: bold; }
        .cat-list a .cat-count { float: right; color: #9ca3af; font-size: 12px; font-weight: normal; }

        /* ===== 内容区：文章列表 ===== */
        .msg { border: 1px solid #fca5a5; background: #fef2f2; color: #dc2626; border-radius: 6px; padding: 10px 14px; margin: 12px 16px; }
        .article-item { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; background: #fff; transition: box-shadow 0.15s; }
        .article-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .article-item:last-child { margin-bottom: 0; }
        .article-title { font-size: 17px; font-weight: bold; }
        .badge { display: inline-block; border-radius: 10px; padding: 1px 10px; font-size: 12px; margin-left: 8px; vertical-align: 2px; }
        .badge-mine { color: #2563eb; border: 1px solid #93c5fd; background: #eff6ff; }
        .badge-other { color: #6b7280; border: 1px solid #d1d5db; background: #f9fafb; }
        .article-meta { color: #6b7280; font-size: 13px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .meta-tag { border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 12px; padding: 1px 10px; font-size: 12px; }
        .del-link { color: #dc2626; border: 1px solid #fca5a5; border-radius: 6px; padding: 2px 10px; font-size: 13px; margin-left: auto; }
        .del-link:hover { background: #fef2f2; text-decoration: none; }
        .empty { color: #6b7280; text-align: center; padding: 28px; }

        /* ===== 页脚 ===== */
        .site-footer { width: 100%; text-align: center; color: #9ca3af; font-size: 13px; padding: 18px; }

        /* ===== 窄屏适配 ===== */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; padding: 0 16px; }
            .site-header { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<header class="site-header">
    <div class="brand"><span class="dot">◆</span> 个人知识系统</div>
    <div class="user-area" th:if="${session.loginUser != null}">
        <span class="welcome">欢迎：<b th:text="${session.loginUser.username}"></b></span>
        <a class="btn" th:href="@{/article/toAdd}">撰写新文章</a>
        <a class="btn-ghost" th:href="@{/user/logout}">退出登录</a>
    </div>
    <div class="user-area" th:unless="${session.loginUser != null}">
        <span class="welcome">游客模式</span>
        <a class="btn" th:href="@{/user/toLogin}">前往登录</a>
    </div>
</header>

<!-- 主体：侧边栏 + 文章列表 -->
<main class="layout">

    <!-- 左侧栏：个人中心 + 文章分类 -->
    <aside class="side-stack">

        <div class="box">
            <div class="box-title">个人中心</div>
            <div class="box-body profile" th:if="${session.loginUser != null}">
                <div class="avatar" th:text="${#strings.substring(session.loginUser.username, 0, 1)}"></div>
                <div class="uname" th:text="${session.loginUser.username}"></div>
                <div class="uinfo">欢迎回来，这里是你的知识库</div>
            </div>
            <div class="box-body profile" th:unless="${session.loginUser != null}">
                <div class="avatar avatar-ghost">游</div>
                <div class="uname">未登录</div>
                <div class="guest-tip">登录后可以撰写、管理自己的文章，你的文章会优先展示并标注"我的"。</div>
                <a class="btn" th:href="@{/user/toLogin}">立即登录</a>
            </div>
        </div>

        <div class="box">
            <div class="box-title">文章分类</div>
            <div class="box-body">
                <ul class="cat-list">
                    <li class="cat-all"><a th:href="@{/article/list}">全部文章 <span class="cat-count" th:text="'(' + ${totalCount} + ')'"></span></a></li>
                    <li th:each="cat : ${categoryList}">
                        <a th:href="@{/article/list(categoryId=${cat.categoryId})}">
                            <span th:text="${cat.categoryName}"></span>
                            <span class="cat-count" th:text="${categoryCountMap[cat.categoryId] != null ? '(' + categoryCountMap[cat.categoryId] + ')' : '(0)'}"></span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </aside>

    <!-- 右侧主区：文章列表 -->
    <section class="box">
        <div class="box-title">文章列表
            <span class="sub">共 <span th:text="${#lists.size(articleList)}"></span> 篇</span>
        </div>

        <p class="msg" th:if="${msg}" th:text="${msg}"></p>

        <div class="box-body">
            <div class="article-item" th:each="art : ${articleList}">
                <div class="article-title">
                    <a th:href="@{/article/detail(articleId=${art.articleId})}" th:text="${art.title}"></a>
                    <span class="badge badge-mine" th:if="${session.loginUser != null and session.loginUser.userId == art.userId}">我的</span>
                    <span class="badge badge-other" th:if="${session.loginUser != null and session.loginUser.userId != art.userId}">他人</span>
                </div>
                <div class="article-meta">
                    <span class="meta-tag" th:text="'作者：' + ${art.username}"></span>
                    <span class="meta-tag" th:text="'分类：' + ${art.categoryName}"></span>
                    <span class="meta-tag" th:text="${art.createTime}"></span>
                    <a class="del-link" th:if="${session.loginUser != null and session.loginUser.userId == art.userId}"
                       th:href="@{/article/delete(articleId=${art.articleId})}"
                       onclick="return confirm('确定删除该文章？')">删除</a>
                </div>
            </div>
            <div class="empty" th:if="${#lists.isEmpty(articleList)}">暂无文章</div>
        </div>
    </section>
</main>

<footer class="site-footer">个人知识系统 · Spring MVC + MyBatis + Thymeleaf</footer>
</body>
</html>
