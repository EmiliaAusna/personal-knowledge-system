<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增知识文章</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f3f4f6; color: #1f2937; font-size: 15px; min-height: 100vh; display: flex; flex-direction: column; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ===== 顶部导航栏（占满宽度，吸顶） ===== */
        .site-header { position: sticky; top: 0; z-index: 20; width: 100%; background: #ffffff; border-bottom: 2px solid #2563eb; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
        .brand { font-size: 20px; font-weight: bold; color: #1f2937; }
        .brand .dot { color: #2563eb; }
        .user-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .welcome { font-size: 14px; color: #374151; }
        .welcome b { color: #2563eb; }
        .btn { display: inline-block; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; padding: 7px 16px; font-size: 14px; }
        .btn:hover { background: #1d4ed8; text-decoration: none; }
        .btn-ghost { display: inline-block; border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 6px; padding: 7px 16px; font-size: 14px; }
        .btn-ghost:hover { border-color: #2563eb; color: #2563eb; text-decoration: none; }

        /* ===== 主体布局：侧边栏 + 内容区（占满宽度） ===== */
        .layout { width: 100%; max-width: 1280px; margin: 24px auto; padding: 0 28px; display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; flex: 1; }
        .side-stack { display: flex; flex-direction: column; gap: 20px; }

        /* ===== 通用框体 ===== */
        .box { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
        .box-title { background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 12px 16px; font-weight: bold; font-size: 16px; }
        .box-title .sub { font-weight: normal; font-size: 13px; color: #6b7280; margin-left: 8px; }
        .box-body { padding: 14px 16px; }

        /* ===== 侧边栏：个人中心 ===== */
        .profile { text-align: center; padding: 18px 16px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background: #2563eb; color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .uname { font-size: 17px; font-weight: bold; }
        .uinfo { font-size: 13px; color: #6b7280; margin-top: 6px; }

        /* ===== 侧边栏：文章分类 ===== */
        .cat-list { list-style: none; }
        .cat-list li { border-radius: 6px; margin-bottom: 4px; }
        .cat-list a { display: block; padding: 8px 12px; color: #374151; border-radius: 6px; font-size: 14px; }
        .cat-list a:hover { background: #eff6ff; color: #2563eb; text-decoration: none; }
        .cat-list .cat-all a { font-weight: bold; }

        /* ===== 撰写表单 ===== */
        .form-row { margin-bottom: 20px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #374151; font-weight: bold; }
        input[type=text], select, textarea { width: 100%; border: 1px solid #9ca3af; border-radius: 6px; padding: 10px 12px; font-size: 15px; }
        input[type=text]:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
        textarea { resize: vertical; line-height: 1.7; }
        .form-actions { display: flex; align-items: center; gap: 12px; }
        .submit-btn { border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; padding: 10px 32px; font-size: 16px; cursor: pointer; }
        .submit-btn:hover { background: #1d4ed8; }
        .back-link { font-size: 14px; }

        /* ===== 页脚 ===== */
        .site-footer { width: 100%; text-align: center; color: #9ca3af; font-size: 13px; padding: 18px; }

        /* ===== 窄屏适配 ===== */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; padding: 0 16px; }
            .site-header { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<header class="site-header">
    <div class="brand"><span class="dot">◆</span> 个人知识系统</div>
    <div class="user-area" th:if="${session.loginUser != null}">
        <span class="welcome">欢迎：<b th:text="${session.loginUser.username}"></b></span>
        <a class="btn-ghost" th:href="@{/article/list}">← 文章列表</a>
        <a class="btn" th:href="@{/user/logout}">退出登录</a>
    </div>
    <div class="user-area" th:unless="${session.loginUser != null}">
        <span class="welcome">游客模式</span>
        <a class="btn" th:href="@{/user/toLogin}">前往登录</a>
    </div>
</header>

<!-- 主体：侧边栏 + 撰写表单 -->
<main class="layout">

    <!-- 左侧栏：个人中心 + 文章分类 -->
    <aside class="side-stack">

        <div class="box">
            <div class="box-title">个人中心</div>
            <div class="box-body profile" th:if="${session.loginUser != null}">
                <div class="avatar" th:text="${#strings.substring(session.loginUser.username, 0, 1)}"></div>
                <div class="uname" th:text="${session.loginUser.username}"></div>
                <div class="uinfo">正在撰写新文章</div>
            </div>
            <div class="box-body profile" th:unless="${session.loginUser != null}">
                <div class="avatar avatar-ghost" style="background:#e5e7eb;color:#6b7280;">游</div>
                <div class="uname">未登录</div>
                <div class="uinfo">登录后才能撰写文章</div>
            </div>
        </div>

        <div class="box">
            <div class="box-title">文章分类</div>
            <div class="box-body">
                <ul class="cat-list">
                    <li class="cat-all"><a th:href="@{/article/list}">全部文章</a></li>
                    <li th:each="cat : ${categoryList}">
                        <a th:href="@{/article/list(categoryId=${cat.categoryId})}" th:text="${cat.categoryName}"></a>
                    </li>
                </ul>
            </div>
        </div>
    </aside>

    <!-- 右侧主区：撰写表单（占满剩余宽度） -->
    <section class="box">
        <div class="box-title">撰写新文章
            <span class="sub">提交后自动跳转到文章列表</span>
        </div>
        <div class="box-body">
            <form th:action="@{/article/add}" method="post">
                <div class="form-row">
                    <label for="title">文章标题</label>
                    <input type="text" id="title" name="title" placeholder="请输入文章标题" required />
                </div>
                <div class="form-row">
                    <label for="categoryId">文章分类</label>
                    <select id="categoryId" name="categoryId">
                        <option th:each="cat : ${categoryList}"
                                th:value="${cat.categoryId}"
                                th:text="${cat.categoryName}"></option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="content">文章内容</label>
                    <textarea id="content" name="content" rows="16" placeholder="在这里输入文章内容，支持 HTML 格式（如 &lt;h2&gt;、&lt;p&gt;、&lt;code&gt; 等）" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">提交文章</button>
                    <a class="back-link" th:href="@{/article/list}">← 返回文章列表</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer class="site-footer">个人知识系统 · Spring MVC + MyBatis + Thymeleaf</footer>
</body>
</html>
